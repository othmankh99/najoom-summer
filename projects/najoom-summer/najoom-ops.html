<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Najoom Ops</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg:    #F0EDE6; --bg2: #FFFFFF; --bg3: #E6E1D8; --bg4: #D8D2C8;
      --gold:  #B07808; --gold2: #8C5F06; --gglow: rgba(176,120,8,.1);
      --red:   #B82020; --rglow: rgba(184,32,32,.08);
      --text:  #1C1814; --muted: rgba(28,24,20,.48); --line: rgba(28,24,20,.1);
      --r: 16px; --r-sm: 10px;
      --nav-h: 68px;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html { -webkit-tap-highlight-color:transparent; }
    body { font-family:'Poppins',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; padding-bottom:var(--nav-h); }
    button,input,select { font-family:'Poppins',sans-serif; }
    button { cursor:pointer; border:none; background:none; }

    /* ── ACTIVITY COLORS ── */
    .ac-swim    { --ac:#1B7FBF; --ab:rgba(27,127,191,.12);  }
    .ac-art     { --ac:#9B4DCA; --ab:rgba(155,77,202,.12);  }
    .ac-martial { --ac:#E06820; --ab:rgba(224,104,32,.12);  }
    .ac-mma     { --ac:#D63030; --ab:rgba(214,48,48,.12);   }
    .ac-ballet  { --ac:#CC3D7A; --ab:rgba(204,61,122,.12);  }
    .ac-story   { --ac:#1BA89A; --ab:rgba(27,168,154,.12);  }
    .ac-explore { --ac:#4AB81B; --ab:rgba(74,184,27,.12);   }
    .ac-sensory { --ac:#7AAB2A; --ab:rgba(122,171,42,.12);  }
    .ac-drama   { --ac:#CC7A1B; --ab:rgba(204,122,27,.12);  }
    .ac-dance   { --ac:#B91BAA; --ab:rgba(185,27,170,.12);  }
    .ac-writing { --ac:#1BA89A; --ab:rgba(27,168,154,.12);  }
    .ac-design  { --ac:#9B4DCA; --ab:rgba(155,77,202,.12);  }
    .ac-free    { --ac:#666;    --ab:rgba(100,100,100,.09); }
    .ac-shared  { --ac:var(--gold); --ab:var(--gglow);      }

    /* ── HEADER ── */
    #hd {
      position:sticky; top:0; z-index:100;
      background:rgba(240,237,230,.97); backdrop-filter:blur(20px);
      border-bottom:1px solid var(--line);
      padding:12px 18px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .hd-l { display:flex; align-items:center; gap:10px; }
    .hd-icon {
      width:36px; height:36px; border-radius:50%; flex-shrink:0;
      background:linear-gradient(135deg,#C02A2A,#8B1E1E);
      display:flex; align-items:center; justify-content:center; font-size:1rem;
    }
    .hd-name { font-size:.9rem; font-weight:800; line-height:1.1; }
    .hd-sub  { font-size:.54rem; font-weight:600; color:var(--muted); letter-spacing:.07em; text-transform:uppercase; }
    #clock { font-size:1.1rem; font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums; text-align:right; line-height:1.1; }
    #cdate { font-size:.54rem; font-weight:600; color:var(--muted); text-align:right; letter-spacing:.05em; margin-top:1px; }

    /* ── BOTTOM NAV ── */
    #bnav {
      position:fixed; bottom:0; left:0; right:0; z-index:100;
      height:var(--nav-h);
      background:rgba(240,237,230,.98); backdrop-filter:blur(20px);
      border-top:1px solid var(--line);
      display:flex;
    }
    .bnb {
      flex:1; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:4px; padding:8px;
      color:var(--muted); transition:color .2s;
    }
    .bnb.active { color:var(--gold); }
    .bnb svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .bnb span { font-size:.6rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }

    /* ── TAB PANELS ── */
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    /* ── WEEK BANNER ── */
    #week-banner {
      background:linear-gradient(90deg, rgba(176,120,8,.12), rgba(176,120,8,.04));
      border-bottom:1px solid rgba(176,120,8,.15);
      padding:10px 18px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .wb-left { display:flex; align-items:center; gap:10px; }
    .wb-num  { font-size:.54rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); background:rgba(176,120,8,.15); padding:3px 9px; border-radius:999px; border:1px solid rgba(176,120,8,.25); flex-shrink:0; }
    .wb-ar   { font-size:.95rem; font-weight:800; color:var(--text); }
    .wb-theme{ font-size:.6rem; color:var(--muted); margin-top:1px; }
    .wb-days { font-size:.58rem; color:var(--muted); text-align:right; flex-shrink:0; }

    .thu-badge { display:inline-flex; align-items:center; gap:4px; font-size:.52rem; font-weight:800; padding:2px 8px; border-radius:999px; background:rgba(176,120,8,.14); color:var(--gold); border:1px solid rgba(176,120,8,.25); letter-spacing:.05em; text-transform:uppercase; margin-right:6px; vertical-align:middle; }

    /* ── DAY TABS ── */
    #dtabs {
      display:flex; gap:7px; padding:12px 16px;
      border-bottom:1px solid var(--line); background:var(--bg2);
      overflow-x:auto;
    }
    #dtabs::-webkit-scrollbar { display:none; }
    .dtab {
      flex-shrink:0; padding:8px 18px; border-radius:999px;
      font-size:.7rem; font-weight:700; letter-spacing:.04em;
      background:var(--bg3); color:var(--muted); border:1px solid var(--line);
      transition:all .2s; white-space:nowrap;
    }
    .dtab.today:not(.active) { border-color:rgba(176,120,8,.3); color:var(--gold); }
    .dtab.active { background:var(--gold); color:#1A0A00; border-color:var(--gold); }

    /* ── NOW STRIP ── */
    #now {
      margin:14px 16px;
      background:var(--bg3); border:1px solid rgba(176,120,8,.2);
      border-left:3px solid var(--gold); border-radius:var(--r);
      padding:14px 16px;
    }
    .now-hd {
      font-size:.56rem; font-weight:700; letter-spacing:.1em; color:var(--gold);
      text-transform:uppercase; display:flex; align-items:center; gap:7px; margin-bottom:9px;
    }
    .pdot { width:7px; height:7px; border-radius:50%; background:var(--gold); animation:pd 2s ease-in-out infinite; }
    @keyframes pd { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(1.6)} }
    #now-range { font-size:.68rem; font-weight:600; color:var(--muted); margin-bottom:9px; }
    .now-rows  { display:flex; flex-direction:column; gap:8px; }
    .now-row   { display:flex; align-items:center; gap:9px; }
    .ng { font-size:.58rem; font-weight:700; padding:3px 10px; border-radius:999px; flex-shrink:0; white-space:nowrap; }
    .ng-l { background:rgba(176,120,8,.18); color:var(--gold); }
    .ng-r { background:rgba(184,32,32,.18);  color:#B82020; }
    .ng-f { background:rgba(27,127,191,.18); color:#1B6EAA; }
    .now-act { font-size:.82rem; font-weight:600; }
    .now-msg { font-size:.82rem; color:var(--muted); text-align:center; padding:2px; }

    /* ── POOL STATUS ── */
    #pools { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 16px 14px; }
    .pc { background:var(--bg3); border:1px solid var(--line); border-radius:var(--r); padding:13px 14px; }
    .pc-lbl   { font-size:.55rem; font-weight:700; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; margin-bottom:7px; }
    .pc-occ   { display:flex; align-items:center; gap:7px; font-size:.78rem; font-weight:700; }
    .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .dot-busy { background:#1B7FBF; box-shadow:0 0 8px rgba(27,127,191,.6); }
    .dot-free { background:#4AB81B; box-shadow:0 0 8px rgba(74,184,27,.5); }
    .pc-until { font-size:.58rem; color:var(--muted); margin-top:4px; }

    /* ── GROUP FILTER ── */
    #gf { display:flex; gap:7px; padding:0 16px 13px; overflow-x:auto; }
    #gf::-webkit-scrollbar { display:none; }
    .gfb {
      flex-shrink:0; padding:8px 15px; border-radius:999px;
      font-size:.66rem; font-weight:600; background:var(--bg3);
      color:var(--muted); border:1px solid var(--line);
      transition:all .2s; white-space:nowrap;
    }
    .gfb.active              { background:var(--bg4); color:var(--text); border-color:rgba(28,24,20,.18); }
    .gfb.gl.active { background:rgba(176,120,8,.14); color:var(--gold); border-color:rgba(176,120,8,.3);  }
    .gfb.gr.active { background:rgba(184,32,32,.14);  color:#B82020;     border-color:rgba(184,32,32,.3);   }
    .gfb.gf.active { background:rgba(27,127,191,.14); color:#1B6EAA;     border-color:rgba(27,127,191,.3);  }

    /* ── SCHEDULE BLOCKS ── */
    #sched { padding:0 16px 32px; }
    .sched-theme { font-size:.64rem; font-weight:700; letter-spacing:.08em; color:var(--gold); text-transform:uppercase; margin-bottom:12px; }
    .col-hds { display:grid; grid-template-columns:1fr 1fr 1fr; margin-bottom:7px; }
    .chd { font-size:.58rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:0 13px; }
    .chd-l{color:var(--gold)} .chd-r{color:#B82020} .chd-f{color:#1B6EAA}

    .blk { margin-bottom:9px; border-radius:var(--r); overflow:hidden; border:1px solid var(--line); }
    .blk.is-now  { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold),0 6px 24px rgba(176,120,8,.1); }
    .blk.is-past { opacity:.35; pointer-events:none; }

    .blk-time {
      display:flex; align-items:center; justify-content:space-between;
      background:var(--bg2); padding:8px 14px;
      font-size:.62rem; font-weight:700; color:var(--muted); letter-spacing:.04em;
    }
    .now-badge { background:var(--gold); color:#1A0A00; font-size:.54rem; font-weight:800; padding:2px 9px; border-radius:999px; letter-spacing:.06em; text-transform:uppercase; }

    .blk-shared { display:flex; align-items:center; gap:11px; padding:14px; background:var(--bg3); }
    .blk-shared.ac-shared { background:var(--ab); }
    .bs-em { font-size:1.1rem; }
    .bs-lbl { font-size:.88rem; font-weight:600; }

    .blk-split { display:grid; background:var(--bg3); }
    .blk-split.va { grid-template-columns:1fr 1fr 1fr; }
    .blk-split.vs { grid-template-columns:1fr; }

    .sc { padding:13px 12px; border-right:1px solid var(--line); }
    .sc:last-child { border-right:none; }
    .sc-grp { font-size:.52rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; opacity:.5; }
    .sc-act { display:flex; align-items:center; gap:7px; margin-bottom:8px; }
    .sc-em  { font-size:.95rem; line-height:1; flex-shrink:0; }
    .sc-name { font-size:.8rem; font-weight:600; line-height:1.25; }

    /* Coach chip */
    .coach-chip {
      display:flex; align-items:center; gap:6px;
      background:var(--bg2); border:1px solid var(--line);
      border-radius:999px; padding:5px 10px;
      font-size:.66rem; font-weight:600; color:var(--muted);
      cursor:pointer; transition:all .2s; margin-bottom:6px;
      width:fit-content; max-width:100%;
    }
    .coach-chip:hover { border-color:var(--gold); color:var(--text); }
    .coach-chip.assigned { background:rgba(176,120,8,.1); border-color:rgba(176,120,8,.3); color:var(--gold); }
    .coach-chip .av { width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.55rem; font-weight:800; color:#fff; flex-shrink:0; }
    .coach-chip .plus-ic { font-size:.7rem; opacity:.5; }

    /* Volunteer chip */
    .vol-chip {
      display:inline-flex; align-items:center; gap:5px;
      font-size:.58rem; font-weight:600; padding:3px 9px;
      border-radius:999px; cursor:pointer;
      background:var(--bg2); border:1px solid var(--line); color:var(--muted);
      transition:all .2s;
    }
    .vol-chip:hover { border-color:rgba(255,255,255,.2); color:var(--text); }
    .vol-chip.has-vols { background:rgba(74,184,27,.1); border-color:rgba(74,184,27,.25); color:#1A7A08; }

    @media (max-width:520px) {
      .blk-split.va { grid-template-columns:1fr; }
      .col-hds { display:none; }
      .sc { border-right:none; border-bottom:1px solid var(--line); }
      .sc:last-child { border-bottom:none; }
    }

    /* ── TEAM TAB ── */
    #tab-team { padding:0 0 20px; }
    .team-section { padding:20px 16px 4px; }
    .ts-hd {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:14px;
    }
    .ts-title { font-size:.88rem; font-weight:800; }
    .ts-count {
      font-size:.62rem; font-weight:700; padding:3px 10px;
      border-radius:999px; background:var(--bg3); color:var(--muted);
      border:1px solid var(--line);
    }
    .btn-add {
      display:flex; align-items:center; gap:6px;
      padding:9px 16px; border-radius:999px;
      background:var(--gold); color:#1A0A00;
      font-size:.7rem; font-weight:700;
      transition:all .18s;
    }
    .btn-add:hover { background:var(--gold2); }
    .btn-add svg { width:14px; height:14px; stroke:#1A0A00; fill:none; stroke-width:2.5; stroke-linecap:round; }

    .person-cards { display:flex; flex-direction:column; gap:9px; }
    .person-card {
      background:var(--bg2); border:1px solid var(--line);
      border-radius:var(--r); padding:14px;
      display:flex; align-items:center; gap:13px;
      transition:border-color .2s;
    }
    .person-card:active { border-color:rgba(28,24,20,.2); }
    .p-av {
      width:42px; height:42px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:1rem; font-weight:800; color:#fff;
    }
    .p-info { flex:1; min-width:0; }
    .p-name { font-size:.85rem; font-weight:700; line-height:1.2; }
    .p-role { font-size:.64rem; color:var(--muted); margin-top:2px; }
    .p-grp-badge {
      font-size:.58rem; font-weight:700; padding:3px 9px;
      border-radius:999px; flex-shrink:0;
    }
    .p-grp-badge.gl { background:rgba(176,120,8,.18); color:var(--gold); }
    .p-grp-badge.gr { background:rgba(184,32,32,.18);  color:#B82020; }
    .p-grp-badge.gf { background:rgba(27,127,191,.18); color:#1B6EAA; }
    .p-grp-badge.gn { background:var(--bg3); color:var(--muted); border:1px solid var(--line); }
    .p-action {
      width:34px; height:34px; border-radius:50%;
      background:var(--bg3); border:1px solid var(--line);
      display:flex; align-items:center; justify-content:center;
      color:var(--muted); font-size:.8rem; flex-shrink:0;
      transition:all .18s;
    }
    .p-action:hover { border-color:rgba(28,24,20,.2); color:var(--text); }

    .empty-state {
      text-align:center; padding:36px 20px;
      color:var(--muted); font-size:.82rem; line-height:1.75;
    }
    .empty-state .em-icon { font-size:2.4rem; margin-bottom:12px; }

    .divider { height:1px; background:var(--line); margin:16px 16px 0; }

    /* ── BOTTOM SHEET ── */
    #sheet-bg {
      position:fixed; inset:0; background:rgba(0,0,0,.6);
      z-index:200; opacity:0; pointer-events:none; transition:opacity .3s;
    }
    #sheet-bg.open { opacity:1; pointer-events:all; }
    #sheet {
      position:fixed; bottom:0; left:0; right:0; z-index:201;
      background:var(--bg3); border-radius:22px 22px 0 0;
      border-top:1px solid rgba(28,24,20,.1);
      transform:translateY(100%); transition:transform .32s cubic-bezier(.25,.46,.45,.94);
      max-height:82vh; display:flex; flex-direction:column;
    }
    #sheet.open { transform:translateY(0); }
    #sheet-handle { width:40px; height:4px; border-radius:2px; background:rgba(28,24,20,.18); margin:12px auto 0; flex-shrink:0; }
    #sheet-body { overflow-y:auto; padding:16px 18px 40px; flex:1; }

    .sheet-title { font-size:1rem; font-weight:800; margin-bottom:4px; }
    .sheet-sub   { font-size:.72rem; color:var(--muted); margin-bottom:18px; }
    .sheet-divider { height:1px; background:var(--line); margin:14px 0; }

    /* Picker list */
    .picker-list { display:flex; flex-direction:column; gap:8px; margin-top:6px; }
    .picker-item {
      display:flex; align-items:center; gap:13px;
      background:var(--bg2); border:1px solid var(--line);
      border-radius:var(--r-sm); padding:12px 14px;
      cursor:pointer; transition:all .18s;
    }
    .picker-item:hover   { border-color:rgba(28,24,20,.18); }
    .picker-item.selected { border-color:var(--gold); background:var(--gglow); }
    .picker-item.busy    { opacity:.5; }
    .pi-av { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:800; color:#fff; flex-shrink:0; }
    .pi-name { font-size:.82rem; font-weight:700; line-height:1.2; }
    .pi-role { font-size:.62rem; color:var(--muted); margin-top:2px; }
    .pi-busy-tag { font-size:.56rem; color:#B82020; font-weight:600; }
    .pi-check { margin-left:auto; color:var(--gold); font-size:1rem; font-weight:900; }
    .picker-empty { text-align:center; color:var(--muted); font-size:.82rem; padding:20px; line-height:1.7; }

    /* Sheet form */
    .sheet-form { display:flex; flex-direction:column; gap:13px; margin-top:6px; }
    .sf-label { font-size:.62rem; font-weight:700; letter-spacing:.06em; color:var(--muted); text-transform:uppercase; margin-bottom:5px; }
    .sf-input {
      width:100%; background:var(--bg2); border:1px solid var(--line);
      border-radius:var(--r-sm); padding:13px 14px;
      font-size:.85rem; font-weight:500; color:var(--text);
      outline:none; transition:border-color .2s;
    }
    .sf-input:focus { border-color:var(--gold); }
    .sf-select {
      width:100%; background:var(--bg2); border:1px solid var(--line);
      border-radius:var(--r-sm); padding:13px 14px;
      font-size:.85rem; font-weight:500; color:var(--text);
      outline:none; appearance:none; cursor:pointer;
    }
    .sf-select:focus { border-color:var(--gold); }
    .sheet-actions { display:flex; gap:10px; margin-top:4px; }
    .btn-primary {
      flex:1; padding:14px; border-radius:var(--r-sm);
      background:var(--gold); color:#1A0A00;
      font-size:.8rem; font-weight:800; letter-spacing:.03em;
      transition:all .18s;
    }
    .btn-primary:hover { background:var(--gold2); }
    .btn-secondary {
      padding:14px 20px; border-radius:var(--r-sm);
      background:var(--bg2); color:var(--muted);
      font-size:.8rem; font-weight:700; border:1px solid var(--line);
      transition:all .18s;
    }
    .btn-secondary:hover { color:var(--text); border-color:rgba(28,24,20,.2); }
    .btn-danger {
      flex:1; padding:14px; border-radius:var(--r-sm);
      background:rgba(184,32,32,.15); color:#B82020;
      font-size:.8rem; font-weight:700; border:1px solid rgba(184,32,32,.25);
      transition:all .18s;
    }
    .btn-danger:hover { background:rgba(184,32,32,.25); }
    .btn-unassign {
      width:100%; padding:13px; border-radius:var(--r-sm);
      background:rgba(184,32,32,.1); color:#B82020;
      font-size:.76rem; font-weight:700; border:1px solid rgba(184,32,32,.2);
      margin-bottom:14px; transition:all .18s;
    }

    /* ── VENUES TAB ── */
    #tab-venues { padding:0 16px 32px; }
    .venues-hd {
      font-size:.56rem; font-weight:700; letter-spacing:.1em; color:var(--gold);
      text-transform:uppercase; padding:16px 0 12px;
    }
    .venue-hours-banner {
      background:var(--bg3); border:1px solid rgba(176,120,8,.2);
      border-left:3px solid var(--gold); border-radius:var(--r);
      padding:13px 16px; margin-bottom:14px;
      display:flex; align-items:center; justify-content:space-between; gap:12px;
    }
    .vhb-label { font-size:.56rem; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; }
    .vhb-time  { font-size:.88rem; font-weight:800; }
    .vhb-divider { width:1px; height:34px; background:var(--line); flex-shrink:0; }
    .venue-card {
      background:var(--bg2); border:1px solid var(--line);
      border-radius:var(--r); padding:14px;
      display:flex; align-items:flex-start; gap:13px; margin-bottom:9px;
    }
    .vc-icon {

function _isCoachReg(r) { const p = (r.pname||'').toLowerCase().trim(); return p.startsWith('coach'); }

function _autoImportTeam() {
  const pending = _C.regs.filter(r => _isTeamReg(r) && r.status !== 'confirmed');
  if (!pending.length) return;

  let volsChanged = false, coachesChanged = false;

  pending.forEach(r => {

        volsChanged = true;
      }
    } else {
      const exists = _C.coaches.some(c => c.fromReg === r.id || c.name.toLowerCase() === r.cname.toLowerCase());
      if (!exists) {
        _C.coaches.push({ id:'rc_'+r.id, name:r.cname, specialty:'General', group:null, phone:r.phone||null, school:r.school||null, fromReg:r.id });
        coachesChanged = true;

  });

  if (volsChanged)    _save('vols',    _C.vols);
  if (coachesChanged) _save('coaches', _C.coaches);

}

// ─── TIME UTILS ──────────────────────────────────────────────────────────────

function toM(t) {
  const [h,m] = t.split(':').map(Number);
  return (h < 7 ? h + 12 : h) * 60 + (m || 0);
}
function nowM() {
  const n = new Date(); return n.getHours() * 60 + n.getMinutes();
}
function fmt(t) {
  const mins = toM(t), h = Math.floor(mins/60), m = mins%60;
  const ap = h >= 12 ? 'PM' : 'AM', h12 = h > 12 ? h-12 : h === 0 ? 12 : h;
  return `${h12}:${String(m).padStart(2,'0')} ${ap}`;
}
function curIdx(dk) {
  const d = S[dk]; if (!d) return -1;
  const now = nowM();
  return d.blocks.findIndex(b => now >= toM(b.s) && now < toM(b.e));
}

const AV_COLORS = ['#C02A2A','#1B7FBF','#4AB81B','#CC3D7A','#E06820','#9B4DCA','#1BA89A','#CC7A1B','#B91BAA'];
function avColor(name) {
  let h = 0; for (const c of name) h = (h*31 + c.charCodeAt(0)) % AV_COLORS.length;
  return AV_COLORS[h];
}
function avHTML(name, size=36) {
  const col = avColor(name), letter = (name||'?').charAt(0).toUpperCase();
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${col};display:flex;align-items:center;justify-content:center;font-size:${size*.38}px;font-weight:800;color:#fff;flex-shrink:0">${letter}</div>`;
}

function renderNow() {
  const isToday = activeDay === todayKey();
  const el = document.getElementById('now');

  if (!isToday) {
    el.innerHTML = `<div class="now-hd"><div class="pdot"></div>Right Now</div><div class="now-msg">Viewing ${DFULL[activeDay]}</div>`;
    return;
  }

  const idx = curIdx(activeDay);
  let rangeHTML = '', bodyHTML = '';

  if (idx === -1) {
    const now = nowM();
    const first = S[activeDay].blocks[0], last = S[activeDay].blocks[S[activeDay].blocks.length-1];
    bodyHTML = `<div class="now-msg">${now < toM(first.s) ? 'Camp opens at 7:30 AM' : now >= toM(last.e) ? 'Camp has ended for today' : 'Outside camp hours'}</div>`;
  } else {
    const b = S[activeDay].blocks[idx];
    rangeHTML = `<div id="now-range">${fmt(b.s)} – ${fmt(b.e)}</div>`;
    if (b.sh) {
      bodyHTML = `<div class="now-msg">${b.sh.e} ${b.sh.n} — All Groups</div>`;
    } else {
      bodyHTML = `<div class="now-rows">` + [
        {key:'l',cls:'ng-l',lbl:'Little Stars',act:b.l},
        {key:'r',cls:'ng-r',lbl:'Rising Stars', act:b.r},
        {key:'f',cls:'ng-f',lbl:'Future Stars', act:b.f},

    }
  }

  el.innerHTML = `<div class="now-hd"><div class="pdot"></div>Right Now</div>${rangeHTML}<div id="now-body">${bodyHTML}</div>`;
}

      if (b.f?.t === 'ac-swim') { (b.f === A.swim_b || b.f === A.swim ? (pB={g:GNAMES.future,u:fmt(b.e)}) : (pA={g:GNAMES.future,u:fmt(b.e)})); }

  }

  function pc(data) {
    return data
      ? `<div class="pc-occ"><div class="dot dot-busy"></div><span>${data.g}</span></div><div class="pc-until">Until ${data.u}</div>`
      : `<div class="pc-occ"><div class="dot dot-free"></div><span>Available</span></div><div class="pc-until"></div>`;
  }

  document.getElementById('pools').innerHTML = `
    <div class="pc"><div class="pc-lbl">Pool A</div>${pc(pA)}</div>
    <div class="pc"><div class="pc-lbl">Pool B</div>${pc(pB)}</div>`;
}

function renderSched() {
  const d = S[activeDay];
  const now = nowM(), isToday = activeDay === todayKey(), ci = isToday ? curIdx(activeDay) : -1;
  let html = `<div class="sched-theme">${DFULL[activeDay]} · ${d.theme}</div>`;

  if (activeGrp === 'all') {
    html += `<div class="col-hds"><div class="chd chd-l">🌟 Little Stars</div><div class="chd chd-r">⭐ Rising Stars</div><div class="chd chd-f">🏆 Future Stars</div></div>`;
  }

  d.blocks.forEach((b, i) => {
    const isNow  = i === ci;
    const isPast = isToday && !isNow && now >= toM(b.e);
    const cls    = `blk${isNow?' is-now':''}${isPast?' is-past':''}`;
    const tl     = `${fmt(b.s)} – ${fmt(b.e)}`;

    const isThuCeremony = activeDay === 'thursday' && b.sh === A.wrapweek;
    const thuBadge = isThuCeremony ? `<span class="thu-badge">⭐ Star of the Week</span>` : '';
    html += `<div class="${cls}"><div class="blk-time"><span>${tl}</span>${thuBadge}${isNow?'<span class="now-badge">Now</span>':''}</div>`;

    if (b.sh) {
      html += `<div class="blk-shared ${b.sh.t}"><span class="bs-em">${b.sh.e}</span><span class="bs-lbl">${b.sh.n}</span></div>`;
    } else {
      const vc = activeGrp === 'all' ? 'va' : 'vs';
      html += `<div class="blk-split ${vc}">`;

      const groups = activeGrp === 'all'
        ? [{k:'l',lbl:'Little Stars'},{k:'r',lbl:'Rising Stars'},{k:'f',lbl:'Future Stars'}]
        : [{k:activeGrp, lbl: GNAMES[activeGrp === 'little'?'little':activeGrp === 'rising'?'rising':'future'].replace(/[🌟⭐🏆] /,'')}];

      const gmap = {l:b.l, r:b.r, f:b.f};

      groups.forEach(({k, lbl}) => {
        const act = gmap[k]; if (!act) return;
        const coachId = LS.getCA(activeDay, i, k);
        const coaches = LS.coaches();
        const coach   = coaches.find(c => c.id === coachId);

        // Volunteers assigned to this group
        const vols = LS.volunteers().filter(v => v.group === (k === 'l' ? 'little' : k === 'r' ? 'rising' : 'future'));
        const volCount = vols.length;

        const coachChip = coach
          ? `<button class="coach-chip assigned" data-action="pick-coach" data-day="${activeDay}" data-bi="${i}" data-gk="${k}">
               ${avHTML(coach.name, 18)}
               <span>${coach.name}</span>
             </button>`
          : `<button class="coach-chip" data-action="pick-coach" data-day="${activeDay}" data-bi="${i}" data-gk="${k}">
               <span class="plus-ic">+</span>
               <span>Assign Coach</span>
             </button>`;

        const volChip = `<button class="vol-chip${volCount ? ' has-vols' : ''}" data-action="view-vols" data-grp="${k === 'l' ? 'little' : k === 'r' ? 'rising' : 'future'}">
          👥 ${volCount ? `${volCount} volunteer${volCount>1?'s':''}` : 'No volunteers'}
        </button>`;

        html += `<div class="sc ${act.t}">
          <div class="sc-grp">${lbl}</div>
          <div class="sc-act"><span class="sc-em">${act.e}</span><span class="sc-name">${act.n}</span></div>
          ${coachChip}
          ${volChip}
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });

  document.getElementById('sched').innerHTML = html;

  if (isToday && ci !== -1) {
    const blks = document.querySelectorAll('.blk');
    if (blks[ci]) setTimeout(() => blks[ci].scrollIntoView({behavior:'smooth',block:'center'}), 100);
  }
}

function areasMatch(busLocation, regArea) {
  if (!busLocation || !regArea) return false;
  const a = busLocation.toLowerCase(), b = regArea.toLowerCase();
  const aw = a.split(/[\s/,\-]+/), bw = b.split(/[\s/,\-]+/);
  return aw.some(w => w.length >= 4 && b.includes(w)) ||
         bw.some(w => w.length >= 4 && a.includes(w));
}

function timeAgo(ts) {
  const d = Date.now() - ts, m = Math.floor(d/60000), h = Math.floor(m/60), dy = Math.floor(h/24);
  if (dy > 0) return dy + 'd ago';
  if (h  > 0) return h  + 'h ago';
  if (m  > 0) return m  + 'm ago';
  return 'Just now';
}

function renderVenues() {
  const now = nowM();
  const A_S = 7*60+30, A_E = 13*60+30, W_E = 16*60;

  let stCls, stLbl;
  if      (now < A_S) { stCls = 'vs-closed'; stLbl = 'Closed';     }
  else if (now < A_E) { stCls = 'vs-active'; stLbl = 'Active';     }
  else if (now < W_E) { stCls = 'vs-watch';  stLbl = 'Watch Only'; }
  else                { stCls = 'vs-closed'; stLbl = 'Closed';     }

  let html = `
    <div class="venues-hd">Permitted Venues</div>
    <div class="venue-hours-banner">
      <div>
        <div class="vhb-label">Activities</div>
        <div class="vhb-time">7:30 AM – 1:30 PM</div>
      </div>
      <div class="vhb-divider"></div>
      <div>
        <div class="vhb-label">Watching</div>
        <div class="vhb-time">Until 4:00 PM</div>
      </div>
    </div>
  `;

  VENUES.forEach(v => {
    const isSupport = v.id === 'bball';
    const badge = isSupport
      ? `<div class="vc-status vs-support"><div class="vs-dot"></div>Support Space</div>`
      : `<div class="vc-status ${stCls}"><div class="vs-dot"></div>${stLbl}</div>`;
    html += `
      <div class="venue-card">
        <div class="vc-icon" style="background:${v.clr}22">${v.e}</div>
        <div class="vc-body">
          <div class="vc-name">${v.n}</div>
          ${v.sub  ? `<div class="vc-sub">${v.sub}</div>`       : ''}
          ${badge}
          ${v.note ? `<div class="vc-note">⚠ ${v.note}</div>` : ''}
        </div>
      </div>
    `;
  });

  document.getElementById('tab-venues').innerHTML = html;
}

function sheetPickCoach(d, bi, gk) {
  const coaches  = LS.coaches();
  const current  = LS.getCA(d, bi, gk);
  const block    = S[d].blocks[bi];
  const act      = block[gk];
  const busy     = new Set(['l','r','f'].filter(g=>g!==gk).map(g=>LS.getCA(d,bi,g)).filter(Boolean));
  const grpName  = gk==='l'?GNAMES.little:gk==='r'?GNAMES.rising:GNAMES.future;
  const grpKey   = gk==='l'?'little':gk==='r'?'rising':'future';
  const idealSpec= act ? SPEC_MATCH[act.t] : null;

  if (coaches.length === 0) {
    openSheet(`
      <div class="sheet-title">Assign Coach</div>
      <div class="sheet-sub">${fmt(block.s)} – ${fmt(block.e)} · ${grpName}</div>
      <div class="picker-empty">No coaches in roster yet.<br>Go to Team tab → Add Coach first.</div>`);
    return;
  }

  // Sort: group+spec match first, then group only, then others, busy last
  function rank(c) {
    if (busy.has(c.id)) return 3;
    const grpMatch  = c.group === grpKey || !c.group;
    const specMatch = c.specialty === idealSpec;
    if (grpMatch && specMatch) return 0;
    if (grpMatch)              return 1;
    return 2;
  }
  const sorted = [...coaches].sort((a,b) => rank(a) - rank(b));

  function itemHTML(c) {
    const r         = rank(c);
    const isBusy    = r === 3;
    const isGrp     = c.group === grpKey;
    const isSpec    = c.specialty === idealSpec;
    const isCurrent = c.id === current;

    let tag = '';
    if (!isBusy) {
      if (isGrp && isSpec) tag = `<span style="font-size:.56rem;font-weight:700;color:var(--gold);background:var(--gglow);border:1px solid rgba(176,120,8,.25);padding:2px 7px;border-radius:999px;white-space:nowrap">⭐ Best Match</span>`;
      else if (isGrp)      tag = `<span style="font-size:.56rem;font-weight:700;color:#1B6EAA;background:rgba(27,127,191,.12);border:1px solid rgba(27,127,191,.25);padding:2px 7px;border-radius:999px;white-space:nowrap">Group Match</span>`;
      else if (isSpec)     tag = `<span style="font-size:.56rem;font-weight:700;color:#1A7A08;background:rgba(74,184,27,.1);border:1px solid rgba(74,184,27,.22);padding:2px 7px;border-radius:999px;white-space:nowrap">Skill Match</span>`;
    }
    const busyTag = isBusy ? `<span class="pi-busy-tag">· Busy this slot</span>` : '';

    return `<div class="picker-item ${isCurrent?'selected':''} ${isBusy?'busy':''}"
        data-action="do-assign-coach" data-id="${c.id}" data-day="${d}" data-bi="${bi}" data-gk="${gk}">
        ${avHTML(c.name, 36)}
        <div style="flex:1;min-width:0">
          <div class="pi-name">${c.name}</div>
          <div class="pi-role" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${c.specialty} ${busyTag} ${tag}</div>
        </div>
        ${isCurrent?'<div class="pi-check">✓</div>':''}
      </div>`;
  }

  openSheet(`
    <div class="sheet-title">Assign Coach</div>
    <div class="sheet-sub">${fmt(block.s)} – ${fmt(block.e)} · ${grpName}${idealSpec ? ` · Ideal: ${idealSpec}` : ''}</div>
    ${current ? `<button class="btn-unassign" data-action="do-assign-coach" data-id="" data-day="${d}" data-bi="${bi}" data-gk="${gk}">Remove Assignment</button>` : ''}
    <div class="picker-list">${sorted.map(itemHTML).join('')}</div>`);
}

// Sheet actions (delegated)
document.getElementById('sheet-body').addEventListener('click', e => {
  // Group selector buttons have no data-action — handle before the early return
  const grpBtn = e.target.closest('.grp-btn');
  if (grpBtn) {
    document.querySelectorAll('#grp-sel .grp-btn').forEach(b => b.classList.remove('active'));
    grpBtn.classList.add('active');
    return;
  }

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const {action, id, day: d, bi, gk, grp} = el.dataset;

  if (action === 'close-sheet') return closeSheet();

  if (action === 'do-assign-coach') {
    LS.setCA(d, +bi, gk, id || null);
    closeSheet(); renderSched();
    return;
  }

  if (action === 'do-add-coach') {
    const name  = document.getElementById('sf-name')?.value.trim();
    const spec  = document.getElementById('sf-spec')?.value;
    const group = selectedGrp() || null;
    if (!name) { document.getElementById('sf-name')?.focus(); return; }
    const list = LS.coaches();
    list.push({id: uid(), name, specialty: spec, group});
    LS.saveCoaches(list);
    closeSheet(); renderTeam();
    return;
  }

  if (action === 'do-edit-coach') {
    const name  = document.getElementById('sf-name')?.value.trim();
    const spec  = document.getElementById('sf-spec')?.value;
    const group = selectedGrp() || null;
    if (!name) return;
    const list = LS.coaches();
    const idx  = list.findIndex(x=>x.id===id);
    if (idx !== -1) { list[idx].name = name; list[idx].specialty = spec; list[idx].group = group; LS.saveCoaches(list); }
    closeSheet(); renderTeam(); renderSched();
    return;
  }

  if (action === 'do-del-coach') {
    const name = LS.coaches().find(x=>x.id===id)?.name || 'coach';
    requirePin(() => { LS.saveCoaches(LS.coaches().filter(x=>x.id!==id)); closeSheet(); renderTeam(); renderSched(); }, `Delete ${name}?`);
    return;
  }

  if (action === 'do-add-vol') {
    const name  = document.getElementById('sf-name')?.value.trim();
    const group = selectedGrp() || null;
    if (!name) { document.getElementById('sf-name')?.focus(); return; }
    const list = LS.volunteers();
    list.push({id: uid(), name, group});
    LS.saveVols(list);
    closeSheet(); renderTeam(); renderSched();
    return;
  }

  if (action === 'do-edit-vol') {
    const name  = document.getElementById('sf-name')?.value.trim();
    const group = selectedGrp() || null;
    if (!name) return;
    const list = LS.volunteers();
    const idx  = list.findIndex(x=>x.id===id);
    if (idx !== -1) { list[idx].name = name; list[idx].group = group; LS.saveVols(list); }
    closeSheet(); renderTeam(); renderSched();
    return;
  }

  if (action === 'do-del-vol') {
    const name = LS.volunteers().find(x=>x.id===id)?.name || 'volunteer';
    requirePin(() => { LS.saveVols(LS.volunteers().filter(x=>x.id!==id)); closeSheet(); renderTeam(); renderSched(); }, `Delete ${name}?`);
    return;
  }

  // ── BUS ACTIONS ──
  if (action === 'do-add-bus') {
    const name = document.getElementById('sf-busname')?.value.trim();
    const loc  = document.getElementById('sf-busloc')?.value.trim();
    if (!name) { document.getElementById('sf-busname')?.focus(); return; }
    if (!loc)  { document.getElementById('sf-busloc')?.focus();  return; }
    const list = LS.buses();
    list.push({id: uid(), name, location: loc});
    LS.saveBuses(list);
    closeSheet(); renderBuses();
    return;
  }

  if (action === 'do-del-bus') {
    const busId = el.dataset.id;
    const busName = LS.buses().find(b=>b.id===busId)?.name || 'bus';
    requirePin(() => {
      LS.saveKids(LS.kids().filter(k => k.busId !== busId));
      LS.saveCoaches(LS.coaches().map(c => c.busId === busId ? {...c, busId: null} : c));
      LS.saveVols(LS.volunteers().map(v => v.busId === busId ? {...v, busId: null} : v));
      LS.saveBuses(LS.buses().filter(b => b.id !== busId));
      closeSheet(); renderBuses();
    }, `Delete ${busName} and all its assignments?`);
    return;
  }

  if (action === 'do-add-kid') {
    const busId = el.dataset.bus;
    const name  = document.getElementById('sf-kidname')?.value.trim();
    if (!name) { document.getElementById('sf-kidname')?.focus(); return; }
    const list = LS.kids();
    list.push({id: uid(), name, busId});
    LS.saveKids(list);
    sheetBusDetail(busId);
    return;
  }

  if (action === 'rm-kid') {
    const kidName = LS.kids().find(k=>k.id===el.dataset.id)?.name || 'kid';
    const busId = el.dataset.bus;
    requirePin(() => { LS.saveKids(LS.kids().filter(k => k.id !== el.dataset.id)); sheetBusDetail(busId); }, `Remove ${kidName} from bus?`);
    return;
  }

  if (action === 'rm-bus-coach') {
    LS.saveCoaches(LS.coaches().map(c => c.id === el.dataset.id ? {...c, busId: null} : c));
    sheetBusDetail(el.dataset.bus);
    return;
  }

  if (action === 'rm-bus-vol') {
    LS.saveVols(LS.volunteers().map(v => v.id === el.dataset.id ? {...v, busId: null} : v));
    sheetBusDetail(el.dataset.bus);
    return;
  }

  if (action === 'pick-bus-coach') { sheetBusCoachPicker(el.dataset.bus); return; }
  if (action === 'pick-bus-vol')   { sheetBusVolPicker(el.dataset.bus);   return; }

  // ── REGISTRATION ACTIONS ──
  if (action === 'reg-assign-bus') { sheetRegBusPicker(el.dataset.id); return; }

  if (action === 'do-reg-assign-bus') {
    const regs = getRegs();
    const reg  = regs.find(r => r.id === el.dataset.regid);
    if (!reg) return;
    const grpMap = {'4-6':'little','7-10':'rising','11-14':'future'};
    const kids = LS.kids();
    kids.push({id: uid(), name: reg.cname, busId: el.dataset.bus, group: grpMap[reg.group]||null, fromReg: reg.id});
    LS.saveKids(kids);
    saveRegs(regs.map(r => r.id===reg.id ? {...r, status:'assigned'} : r));
    closeSheet(); renderRegistrations(); renderBuses();
    return;
  }

  if (action === 'reg-quick-add') {
    const regs = getRegs();
    const reg  = regs.find(r => r.id === el.dataset.regid);
    if (!reg) return;
    const grpMap = {'4-6':'little','7-10':'rising','11-14':'future'};
    const kids = LS.kids();
    kids.push({id: uid(), name: reg.cname, busId: el.dataset.bus, group: grpMap[reg.group]||null, fromReg: reg.id});
    LS.saveKids(kids);
    saveRegs(regs.map(r => r.id===reg.id ? {...r, status:'assigned'} : r));
    sheetBusDetail(el.dataset.bus);
    return;
  }

  if (action === 'reg-confirm') {
    saveRegs(getRegs().map(r => r.id===el.dataset.id ? {...r, status:'confirmed'} : r));
    renderRegistrations();
    return;
  }

  if (action === 'reg-delete') {
    const regName = getRegs().find(r=>r.id===el.dataset.id)?.cname || 'registration';
    requirePin(() => { saveRegs(getRegs().filter(r => r.id!==el.dataset.id)); renderRegistrations(); }, `Delete registration for ${regName}?`);
    return;
  }

  if (action === 'do-bus-coach') {
    const coaches = LS.coaches();
    const c = coaches.find(x => x.id === el.dataset.id);
    if (!c) return;
    LS.saveCoaches(coaches.map(x => x.id === el.dataset.id ? {...x, busId: c.busId === el.dataset.bus ? null : el.dataset.bus} : x));
    sheetBusCoachPicker(el.dataset.bus);
    return;
  }

  if (action === 'do-bus-vol') {
    const vols = LS.volunteers();
    const v = vols.find(x => x.id === el.dataset.id);
    if (!v) return;
    LS.saveVols(vols.map(x => x.id === el.dataset.id ? {...x, busId: v.busId === el.dataset.bus ? null : el.dataset.bus} : x));
    sheetBusVolPicker(el.dataset.bus);
    return;
  }
});

// ─── INIT ────────────────────────────────────────────────────────────────────

_setupSync();
_fetchSheetTeam();
setInterval(_fetchSheetTeam, 5 * 60 * 1000);
_fetchSheetRegs();
setInterval(_fetchSheetRegs, 5 * 60 * 1000);
activeDay = todayKey() || 'sunday';
renderDayTabs(); renderNow(); renderPools(); renderSched();
tickClock();
setInterval(tickClock, 1000);
setInterval(() => {
  renderNow(); renderPools();
  if (!document.querySelector('#sheet.open')) renderSched();
}, 30000);
</script>
</body>
